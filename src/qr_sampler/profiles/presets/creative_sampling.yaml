id: creative_sampling
name: "Creative Sampling"
description: |
  Experimental dynamic-temperature preset based on the hvh_drift family —
  the "HVD champion". Matches the V7_HVD_R02_00 program-champion
  configuration from qr-llm-research/dynamic-temperature-sampling (v7
  program): mean +1.25 creative margin over three independent anchor
  snapshots (+1.17 r02 / +1.56 r03 / +1.01 r04), the only configuration
  replicated on three snapshots.

  Entropy-history aware temperature: two EMAs track recent entropy and
  varentropy, and the instantaneous-vs-smoothed drift feeds the
  temperature and min-p formulas. Sustained heat self-limits — the EMA
  absorbs it and the drift term returns to zero — and min-p scales with
  live entropy (~0.10 in ordinary prose), pruning the garbage tail when
  the distribution runs hot. Knobs assume the v7-aligned drift semantics
  (drift measured against the previous EMA), which is what the engine
  implements. Quantum entropy still drives final token selection; this
  preset only shapes the temperature and min-p truncation per token.

  Replaced the V7_GDT_R05_02 GDT bell-lift on 2026-08-26: the bell-lift
  was tuned at the t_peak=1.5 family coherence cliff on Qwen3.6 and went
  incoherent on Qwen3.8-PrismaAQUA. Tuning is held verbatim from the V7
  champion (all nine knobs); per-request overrides (``qr_hvh_*`` keys)
  take precedence if a caller supplies them.

experimental: true
origin: "V7_HVD_R02_00 'HVD champion' (qr-llm-research/dynamic-temperature-sampling, v7 program)"
overrides:
  temperature_strategy: hvh_drift
  hvh_t_base: 1.53
  hvh_alpha_h: 0.3
  hvh_alpha_vh: -0.2
  hvh_gamma_dh: 1.0
  hvh_delta_dvh: 0.5
  hvh_lambda_ema: 0.02
  hvh_min_p_base: 0.039045
  hvh_kappa_h: 0.03
  hvh_nu_dh: 0.02
  top_k: 0
  top_p: 1.0
